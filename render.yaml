databases:
  - name: expenses-tracker-db
    plan: free
    databaseName: expenses_tracker
    user: expenses_tracker

services:
  - type: web
    name: expenses-tracker
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: expenses-tracker-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
